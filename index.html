<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخبز اللبناني - Olivea | منيو إلكتروني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b131e 0%, #1a1f2e 100%);
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0b131e;
        }

        ::-webkit-scrollbar-thumb {
            background: #006837;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #008c47;
        }

        /* Sticky Categories */
        .categories-scroll {
            scroll-behavior: smooth;
        }

        .category-btn {
            transition: all 0.3s ease;
            white-space: nowrap;
            padding: 10px 20px;
        }

        .category-btn.active {
            color: #006837;
            border-bottom: 3px solid #006837;
            font-weight: bold;
        }

        /* Menu Cards Animation */
        .menu-card {
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
        }

        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(0, 104, 55, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating Cart */
        .floating-cart {
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Modal */
        .modal {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Price Badge */
        .price-badge {
            background: linear-gradient(135deg, #006837 0%, #008c47 100%);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Quantity Control */
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a2332;
            border-radius: 8px;
            padding: 5px 10px;
            width: fit-content;
        }

        .quantity-btn {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background: #006837;
            color: white;
            font-weight: bold;
        }

        .quantity-btn:hover {
            background: #008c47;
            transform: scale(1.05);
        }

        /* Admin Panel */
        .admin-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
        }

        .admin-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37 0%, #c9a227 100%);
            color: #0b131e;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .admin-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.5);
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid #1a2332;
            border-top: 4px solid #006837;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #006837 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Custom Input */
        input, textarea, select {
            background: #1a2332 !important;
            border: 1px solid #006837 !important;
            color: #e0e0e0 !important;
            border-radius: 8px !important;
        }

        input::placeholder, textarea::placeholder {
            color: #888 !important;
        }

        input:focus, textarea:focus, select:focus {
            outline: none !important;
            border-color: #008c47 !important;
            box-shadow: 0 0 10px rgba(0, 104, 55, 0.3) !important;
        }

        /* No Items Message */
        .no-items {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .no-items i {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
